name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install runtime dependencies (onnxruntime-web, coi-serviceworker)
        run: tools/setup-web.sh
      - name: Syntax check
        run: for f in web/*.js; do node --check "$f"; done
      - name: Assemble site
        run: |
          mkdir _site
          cp web/index.html web/app.js web/worker.js web/engine.js web/nn.js web/mcts.js web/coi-serviceworker.js _site/
          cp -r web/ort _site/ort
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
